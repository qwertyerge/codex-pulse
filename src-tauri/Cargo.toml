[package]
name = "codex-pulse"
version = "0.4.2"
description = "A local desktop monitor for active Codex sessions"
license = "Apache-2.0"
repository = "https://github.com/qwertyerge/codex-pulse"
authors = ["Codex Pulse contributors"]
edition = "2021"
rust-version = "1.82"
default-run = "CodexPulse"

[[bin]]
name = "CodexPulse"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
same-file = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
walkdir = "2"
uuid = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
tauri = { version = "2", features = ["test"] }
tempfile = "3"
