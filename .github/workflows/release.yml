name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = \"\([^\"]*\)\"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          if [[ ! "$GITHUB_REF_NAME" =~ $semver_pattern ]]; then
            echo "Tag $GITHUB_REF_NAME is not a strict SemVer version" >&2
            exit 1
          fi

          if [[ "$package_version" != "$GITHUB_REF_NAME" ||
                "$tauri_version" != "$GITHUB_REF_NAME" ||
                "$cargo_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package ($package_version), Tauri ($tauri_version), and Cargo ($cargo_version) versions" >&2
            exit 1
          fi

          authorization="$(scripts/github-basic-auth.sh)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not contained in origin/main" >&2
            exit 1
          fi

  release:
    name: Release (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    needs: guard
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: macOS ARM64
            platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            apple-signing-identity: "-"
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            apple-signing-identity: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        run: pnpm test
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple-signing-identity }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex Pulse __VERSION__"
          releaseCommitish: ${{ github.sha }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: "--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}"

  verify_updater_manifest:
    name: Verify updater manifest
    runs-on: ubuntu-latest
    needs: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download updater manifest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/updater-manifest"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/updater-manifest" \
            --clobber
      - name: Validate updater manifest
        run: node scripts/verify-updater-manifest.mjs "$RUNNER_TEMP/updater-manifest/latest.json" "$GITHUB_REF_NAME"
